[project]
name = "endplaydesktop"
version = "0.0.3"
description = "Endfield PlayCover desktop input and MaaEnd app patch"
requires-python = ">=3.10"
dependencies = [
    "json5>=0.12,<1",
    "maafw>=5.15.0b1,<6",
    "numpy>=2,<3",
    "Pillow>=12,<13",
]

[tool.uv]
package = false

[dependency-groups]
bundle = [
    "pyinstaller>=6.22.3",
    "pyobjc-framework-cocoa>=12.2.2",
]
